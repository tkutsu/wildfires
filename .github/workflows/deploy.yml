name: Build and deploy

on:
  push:
    branches: [main]
  # EFFIS publishes Greece in two bursts, a couple of hours after each pair of
  # satellite passes: 02:00-05:00 UTC for the night passes and 12:00-15:00 UTC
  # for the day ones, with nothing in between. One build after each catches
  # about 95% of both; the browser picks up the stragglers. GitHub can start a
  # scheduled run late under load, which the quiet hours after each burst
  # absorb.
  schedule:
    - cron: "30 5 * * *"
    - cron: "30 15 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # In a public repository GitHub pauses scheduled workflows after 60 days
  # without a push, and it treats automating activity to prevent that as a
  # terms-of-service violation (it disabled the keepalive-workflow action for
  # it). So nothing here fakes a commit. From day 50 this job fails instead,
  # which GitHub notifies the owner about, leaving ten days to push a real
  # change. The build and deploy do not depend on it and carry on regardless.
  inactivity:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Warn before GitHub pauses the schedule
        run: |
          days=$(( ($(date +%s) - $(git log -1 --format=%ct)) / 86400 ))
          echo "Last commit was $days days ago."
          if [ "$days" -ge 50 ]; then
            echo "::error title=Schedule pauses soon::No commit for $days days. GitHub stops this schedule at 60 days without a push. Push any real change to keep the map updating."
            exit 1
          fi

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint && pnpm typecheck && pnpm test
      # Fetches EFFIS and writes public/data, then exports to out/.
      # The site is served from a domain root, so no basePath is needed.
      - run: pnpm build
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
