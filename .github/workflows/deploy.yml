name: Build and deploy

on:
  push:
    branches: [main]
  # Daily is enough: the browser tops the detections up from EFFIS on every
  # visit, so a rebuild only refreshes the burn scars and the season's tail —
  # and EFFIS maps a perimeter days after its fire starts.
  #
  # GitHub disables scheduled workflows after 60 days without repo activity;
  # re-enable from the Actions tab if the map ever goes stale.
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint && pnpm typecheck && pnpm test
      # Fetches EFFIS and writes public/data, then exports to out/.
      # The site is served from a domain root, so no basePath is needed.
      - run: pnpm build
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
